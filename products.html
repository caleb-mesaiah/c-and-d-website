  <script>

  /* =========================================================
     C&D MULTITECH HEADER JAVASCRIPT

     ORIGINAL LOGIC — PRESERVED
  ========================================================= */

  (function () {

    const menuButton =
      document.querySelector(".cnd-menu-toggle");

    const navigation =
      document.querySelector(".cnd-nav-links");


    if (menuButton && navigation) {

      menuButton.addEventListener("click", function (event) {

        event.stopPropagation();

        const isOpen =
          navigation.classList.toggle("cnd-active");

        menuButton.setAttribute(
          "aria-expanded",
          isOpen ? "true" : "false"
        );

      });


      navigation
        .querySelectorAll("a")
        .forEach(function (link) {

          link.addEventListener("click", function () {

            navigation.classList.remove("cnd-active");

            menuButton.setAttribute(
              "aria-expanded",
              "false"
            );

          });

        });


      document.addEventListener("click", function (event) {

        if (
          !event.target.closest(".cnd-navigation")
        ) {

          navigation.classList.remove("cnd-active");

          menuButton.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      });

    }


    const modeButton =
      document.getElementById("cnd-mode-toggle");


    if (modeButton) {

      const savedMode =
        localStorage.getItem("cnd-dark-mode");


      if (savedMode === "true") {

        document.documentElement.classList.add(
          "cnd-dark-mode"
        );

        modeButton.textContent = "☀️";

      }


      modeButton.addEventListener("click", function () {

        const darkMode =
          document.documentElement.classList.toggle(
            "cnd-dark-mode"
          );


        localStorage.setItem(
          "cnd-dark-mode",
          darkMode
        );


        modeButton.textContent =
          darkMode ? "☀️" : "🌙";

      });

    }

  })();

  </script>

  <!-- =========================================================

  <audio

    <source

    Your browser does not support the audio element.

  </audio>


  <script>

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        /* Check if sound has already played in this session */

        if (
          sessionStorage.getItem('introPlayed') === 'true'
        ) {

          return;

        }


        const audio =
          document.getElementById('introSound');


        if (!audio) {

          return;

        }


        audio.volume = 0.4;


        const playPromise =
          audio.play();


        if (
          playPromise !== undefined
        ) {

          playPromise.then(
            function() {

              sessionStorage.setItem(
                'introPlayed',
                'true'
              );

              console.log(
                "Intro sound played once"
              );

            }
          ).catch(
            function(error) {

              console.log(
                "Autoplay blocked:",
                error
              );


              document.body.addEventListener(
                'click',
                function playOnce() {

                  audio.play().then(
                    function() {

                      sessionStorage.setItem(
                        'introPlayed',
                        'true'
                      );

                    }
                  ).catch(
                    function(e) {

                      console.log(
                        "Fallback failed:",
                        e
                      );

                    }
                  );


                  document.body.removeEventListener(
                    'click',
                    playOnce
                  );

                },
                {
                  once: true
                }
              );

            }
          );

        }

      }
    );

  </script>

<script>

/* =========================================================
   C&D MULTITECH HEADER JAVASCRIPT
========================================================= */

(function () {

  /* -----------------------------------------
     MOBILE MENU
  ----------------------------------------- */

  const menuButton =
    document.querySelector(".cnd-menu-toggle");

  const navigation =
    document.querySelector(".cnd-nav-links");


  if (menuButton && navigation) {

    menuButton.addEventListener("click", function (event) {

      event.stopPropagation();

      const isOpen =
        navigation.classList.toggle("cnd-active");

      menuButton.setAttribute(
        "aria-expanded",
        isOpen ? "true" : "false"
      );

    });


    /* CLOSE AFTER CLICKING LINK */

    navigation
      .querySelectorAll("a")
      .forEach(function (link) {

        link.addEventListener("click", function () {

          navigation.classList.remove("cnd-active");

          menuButton.setAttribute(
            "aria-expanded",
            "false"
          );

        });

      });


    /* CLOSE WHEN CLICKING OUTSIDE */

    document.addEventListener("click", function (event) {

      if (
        !event.target.closest(".cnd-navigation")
      ) {

        navigation.classList.remove("cnd-active");

        menuButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    });

  }


  /* -----------------------------------------
     DARK MODE
  ----------------------------------------- */

  const modeButton =
    document.getElementById("cnd-mode-toggle");


  if (modeButton) {

    /* Check previously saved preference */

    const savedMode =
      localStorage.getItem("cnd-dark-mode");


    if (savedMode === "true") {

      document.documentElement.classList.add(
        "cnd-dark-mode"
      );

      modeButton.textContent = "☀️";

    }


    modeButton.addEventListener("click", function () {

      const darkMode =
        document.documentElement.classList.toggle(
          "cnd-dark-mode"
        );


      localStorage.setItem(
        "cnd-dark-mode",
        darkMode
      );


      modeButton.textContent =
        darkMode ? "☀️" : "🌙";

    });

  }

})();

</script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Check if sound has already played in this session
    if (sessionStorage.getItem('introPlayed') === 'true') {
      return; // already played → skip
    }

    const audio = document.getElementById('introSound');
    audio.volume = 0.4; // 40% volume – adjust if needed

    // Try to play
    const playPromise = audio.play();

    if (playPromise !== undefined) {
      playPromise.then(() => {
        sessionStorage.setItem('introPlayed', 'true'); // mark as played
        console.log("Intro sound played once");
      }).catch(error => {
        console.log("Autoplay blocked:", error);
        // Fallback: play on first user click anywhere
        document.body.addEventListener('click', function playOnce() {
          audio.play().then(() => {
            sessionStorage.setItem('introPlayed', 'true');
          }).catch(e => console.log("Fallback failed:", e));
          document.body.removeEventListener('click', playOnce);
        }, { once: true });
      });
    }
  });
</script>
